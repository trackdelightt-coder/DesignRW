<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美工資料站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F3; --sheet:#FFFFFF; --ink:#1B1D1F; --ink-2:#55595E; --rule:#D9DCD8;
  --c:#0090C8; --m:#D1246C; --y:#EFC300; --k:#1B1D1F; --danger:#C0392B; --focus:#0090C8;
  --radius:6px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16181A; --sheet:#1F2225; --ink:#ECEDEB; --ink-2:#A3A8AC; --rule:#33373B;
    --c:#3DB4E6; --m:#EC5B96; --y:#F2CF3A; --k:#ECEDEB; --danger:#E7766A; --focus:#3DB4E6;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--c)}

/* 刊頭：裁切線 + 色條 */
.mast{position:relative;max-width:1120px;margin:0 auto;padding:40px 28px 28px}
.mast::before,.mast::after,.mast .cm1,.mast .cm2{content:"";position:absolute;width:18px;height:18px;border-color:var(--ink-2)}
.mast::before{left:6px;top:14px;border-right:1px solid;border-bottom:1px solid}
.mast::after{right:6px;top:14px;border-left:1px solid;border-bottom:1px solid}
.mast .cm1{left:6px;bottom:0;border-right:1px solid;border-top:1px solid}
.mast .cm2{right:6px;bottom:0;border-left:1px solid;border-top:1px solid}
.mast-row{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.mast h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:.04em;line-height:1.15}
.mast p.sub{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.bar{display:flex;height:8px;width:112px;margin-bottom:14px}
.bar i{flex:1}
.bar i:nth-child(1){background:var(--c)}.bar i:nth-child(2){background:var(--m)}
.bar i:nth-child(3){background:var(--y)}.bar i:nth-child(4){background:var(--k)}
.search{flex:1 1 300px;max-width:420px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--radius)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-2)}

.layout{max-width:1120px;margin:0 auto;padding:8px 28px 40px;display:grid;grid-template-columns:200px 1fr;gap:36px}
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-top:8px}
nav.cats button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-left:3px solid transparent;cursor:pointer;color:var(--ink-2)}
nav.cats button:hover{color:var(--ink)}
nav.cats button[aria-current="true"]{color:var(--ink);font-weight:700;border-left-color:var(--m);background:var(--sheet)}
nav.cats .n{font-size:13px;color:var(--ink-2);font-weight:400}
.admin-tools{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);display:grid;gap:8px}

main{min-width:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:22px;font-weight:700;display:inline}
.muted{color:var(--ink-2);font-size:14px}

.btn{border:1px solid var(--rule);background:var(--sheet);padding:8px 14px;border-radius:var(--radius);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-block;line-height:1.5}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

.list{border-top:2px solid var(--ink)}
.item{border-bottom:1px solid var(--rule)}
.item-head{display:grid;grid-template-columns:1fr auto;gap:12px;width:100%;text-align:left;border:0;background:none;padding:16px 4px;cursor:pointer;align-items:baseline}
.item-head:hover .t{text-decoration:underline;text-decoration-color:var(--m);text-underline-offset:4px}
.t{font-size:18px;font-weight:700}
.pin{display:inline-block;width:8px;height:8px;background:var(--m);border-radius:50%;margin-right:8px;vertical-align:middle}
.meta{font-size:13px;color:var(--ink-2);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;color:var(--ink-2);border:1px solid var(--rule);padding:0 7px;border-radius:3px}
.item-body{padding:4px 4px 24px;display:none}
.item.open .item-body{display:block}
.item.open .item-head{padding-bottom:8px}

.prose{max-width:72ch}
.prose h3{font-size:17px;margin:22px 0 6px;padding-left:10px;border-left:3px solid var(--c)}
.prose h4{font-size:16px;margin:16px 0 4px}
.prose p{margin:8px 0}
.prose ul{margin:8px 0;padding-left:1.3em}
.prose li{margin:3px 0}
.prose code{background:var(--paper);border:1px solid var(--rule);padding:0 5px;border-radius:3px;font-size:.92em}
.prose blockquote{margin:12px 0;padding:10px 14px;background:var(--paper);border-left:3px solid var(--y)}
.tablewrap{overflow-x:auto;margin:10px 0}
.prose table{border-collapse:collapse;min-width:320px}
.prose th,.prose td{border:1px solid var(--rule);padding:6px 12px;text-align:left}
.prose th{background:var(--paper)}
.checks{list-style:none;padding-left:0 !important}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:3px 0}
.checks input{margin-top:6px;width:17px;height:17px;accent-color:var(--m)}
.checks input:checked + span{color:var(--ink-2);text-decoration:line-through}

.files{margin-top:18px;display:grid;gap:8px;max-width:72ch}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;border-radius:var(--radius)}
.ext{font-size:12px;font-weight:700;min-width:44px;text-align:center;padding:4px 0;color:#fff;background:var(--ink-2);border-radius:3px}
.ext.pdf{background:var(--m)}.ext.img{background:var(--c)}.ext.data{background:#7A8B2E}.ext.link{background:#7A5AA8}
.file .fn{flex:1;min-width:0;overflow:hidden}
.file .ln{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .lnote,.file .lhost{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .lhost{font-size:12px}
.item-admin{margin-top:18px;display:flex;gap:8px}

.empty{padding:48px 8px;text-align:center;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.notice{padding:12px 16px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--radius);margin:0 0 12px;font-size:14px}
.notice.warn{border-left:3px solid var(--y)}

footer{max-width:1120px;margin:0 auto;padding:0 28px 40px;display:flex;justify-content:flex-end;gap:12px;align-items:center}
footer button{border:0;background:none;color:var(--ink-2);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}

dialog{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:0;width:min(720px,94vw);max-height:90vh}
dialog.narrow{width:min(400px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:22px 24px;display:grid;gap:14px}
.dlg h3{margin:0;font-size:20px}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:500}
.field input[type=text],.field input[type=email],.field input[type=password],.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--rule);background:var(--paper);border-radius:var(--radius)}
.field textarea{min-height:240px;font-size:15px;line-height:1.6;resize:vertical}
.field textarea.short{min-height:80px}
.hint{font-size:13px;color:var(--ink-2)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1 1 200px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.catrow{display:flex;gap:6px;align-items:center}
.catrow input{flex:1;padding:7px 10px;border:1px solid var(--rule);background:var(--paper);border-radius:6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}

@media (max-width:760px){
  .mast{padding:32px 18px 20px}
  .layout{grid-template-columns:1fr;padding:0 18px 32px;gap:8px}
  nav.cats{position:static;display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
  nav.cats button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;gap:6px}
  nav.cats button[aria-current="true"]{border-bottom-color:var(--m);background:none}
  .admin-tools{display:none}
  .item-head{grid-template-columns:1fr}
  footer{padding:0 18px 32px}
}
@media (max-width:520px){.file{flex-wrap:wrap}.file .fn{flex-basis:calc(100% - 60px)}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header class="mast">
  <span class="cm1"></span><span class="cm2"></span>
  <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="mast-row">
    <div>
      <h1 id="siteTitle">美工資料站</h1>
      <p class="sub" id="siteSub"></p>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋，例如：出血、報價、A3" aria-label="搜尋">
    </div>
  </div>
</header>

<div class="layout">
  <nav class="cats" id="cats" aria-label="分類"></nav>
  <main>
    <div id="status"></div>
    <div class="toolbar">
      <div><h2 id="viewTitle">全部</h2><span class="muted" id="viewCount"></span></div>
      <div id="adminBar" hidden><button class="btn primary" id="btnNew" type="button">新增條目</button></div>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>

<footer>
  <span class="muted" id="whoami"></span>
  <button type="button" id="btnLogin">管理登入</button>
</footer>

<!-- 登入 -->
<dialog id="dlgLogin" class="narrow">
  <div class="dlg">
    <h3>管理登入</h3>
    <div class="field"><label for="lEmail">Email</label><input type="email" id="lEmail" autocomplete="username"></div>
    <div class="field"><label for="lPass">密碼</label><input type="password" id="lPass" autocomplete="current-password"></div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="btnLoginCancel">取消</button>
      <button type="button" class="btn primary" id="btnLoginGo">登入</button>
    </div>
  </div>
</dialog>

<!-- 編輯條目 -->
<dialog id="dlgEdit">
  <div class="dlg">
    <h3 id="editHead">新增條目</h3>
    <div class="row">
      <div class="field" style="flex:2 1 280px"><label for="fTitle">標題</label><input type="text" id="fTitle"></div>
      <div class="field"><label for="fCat">分類</label><select id="fCat"></select></div>
    </div>
    <div class="field"><label for="fTags">標籤（用逗號分隔）</label><input type="text" id="fTags" placeholder="出血, 印刷, DM"></div>
    <div class="field">
      <label for="fBody">內容</label>
      <textarea id="fBody"></textarea>
      <span class="hint">寫法：<code>## 小標</code>　<code>- 項目</code>　<code>- [ ] 檢核項目</code>　<code>**粗體**</code>　<code>&gt; 提醒</code>　表格用 <code>| 欄 | 欄 |</code></span>
    </div>
    <div class="field">
      <label for="fFiles">附件下載（每行一個：檔名 | 說明 | 檔案網址，說明可省略）</label>
      <textarea id="fFiles" class="short" placeholder="115年度輸出報價單.pdf | files/115年度輸出報價單.pdf"></textarea>
      <span class="hint">放在 GitHub 的檔案填 <code>files/檔名.pdf</code>；雲端硬碟檔案填分享連結（權限設為「知道連結的人皆可檢視」）。</span>
    </div>
    <div class="field">
      <label for="fLinks">外部連結（每行一個：名稱 | 說明 | 網址，說明可省略）</label>
      <textarea id="fLinks" class="short" placeholder="Google Fonts | 免費可商用字體 | https://fonts.google.com"></textarea>
    </div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fPin"> 置頂</label>
    <div class="dlg-foot">
      <button type="button" class="btn" id="btnCancel">取消</button>
      <button type="button" class="btn primary" id="btnSave">儲存</button>
    </div>
  </div>
</dialog>

<!-- 管理分類 -->
<dialog id="dlgCats">
  <div class="dlg">
    <h3>管理分類與站名</h3>
    <div class="row">
      <div class="field"><label for="sTitle">站名</label><input type="text" id="sTitle"></div>
      <div class="field" style="flex:2 1 280px"><label for="sSub">副標</label><input type="text" id="sSub"></div>
    </div>
    <div class="field"><label>分類（上下調整順序；有條目的分類無法刪除）</label><div id="catEdit" style="display:grid;gap:6px"></div></div>
    <div><button type="button" class="btn small" id="btnAddCat">新增分類</button></div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="btnCatsCancel">取消</button>
      <button type="button" class="btn primary" id="btnCatsSave">儲存</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

 {id:"bleed",categoryId:"print",pinned:true,title:"出血與安全距離",tags:["出血","裁切","安全距離"],updatedAt:T0,files:[],links:[],
  body:"## 出血\n- 一般印刷品（DM、海報、名片）每邊預留 **3mm** 出血。\n- 滿版的底色、色塊、圖片都要延伸到出血線，不能只做到完稿尺寸。\n- 例：A4 完稿 210×297mm，含出血的文件尺寸為 **216×303mm**。\n\n## 安全距離\n- 文字、Logo、價格等重要資訊，距離裁切線往內至少 **3～5mm**。\n- 有摺線的印刷品（三摺DM等），摺線附近也要避開重要文字。\n\n## 大圖輸出\n> 帆布、背膠、燈箱片等大圖輸出，出血與包邊尺寸依輸出廠與施工方式而定（例如需要打孔、包框、捲軸時），發稿前請先和輸出廠確認。"},
 {id:"color-dpi",categoryId:"print",pinned:false,title:"解析度與色彩模式",tags:["解析度","dpi","CMYK","RGB","四色黑"],updatedAt:T0,files:[],links:[],
  body:"## 解析度\n- 一般印刷品：圖片在**實際印刷尺寸**下需達 **300dpi**。\n- 大圖輸出因觀看距離較遠，常見要求較低，實際數值請依輸出廠建議。\n- 從網路下載的小圖直接放大，解析度會不足，印出來會模糊。\n\n## 色彩模式\n- 印刷品一律使用 **CMYK**。\n- 電視牆、螢幕、社群圖使用 **RGB**。\n- RGB 轉 CMYK 後，螢光色、亮藍、亮綠會變暗，屬正常現象，要以轉換後的顏色為準。\n\n## 黑色的設定\n- 小字、細線用單黑 **K100**，避免套印不準造成字邊出現彩色毛邊。\n- 大面積黑底可以用四色黑讓黑色更飽和，但總墨量不可超過印刷廠規定的上限。"},
 {id:"file-prep",categoryId:"print",pinned:false,title:"送印檔案整理",tags:["轉外框","封裝","PDF","刀模"],updatedAt:T0,files:[],links:[],
  body:"## 文字\n- 所有文字**建立外框**（轉曲），避免印刷廠沒有字體而跑版。\n- 轉外框前先另存一份可編輯的原始檔。\n\n## 圖片\n- 連結圖檔要嵌入，或用「封裝」把所有連結檔一起交出。\n\n## 其他\n- 刪除版面外多餘物件與隱藏圖層。\n- 刀模線、特別色、燙金、上光範圍，各自放在獨立圖層並標示清楚。\n- 交件格式依印刷廠要求，常見為 PDF 或 AI。"},
 {id:"checklist",categoryId:"check",pinned:true,title:"送印前檢核表",tags:["檢核","送印"],updatedAt:T0,files:[],links:[],
  body:"> 打勾狀態只存在你自己的瀏覽器，不會影響其他人。\n\n## 尺寸\n- [ ] 完稿尺寸正確\n- [ ] 四邊已加出血\n- [ ] 重要文字在安全距離內\n\n## 色彩與圖片\n- [ ] 色彩模式為 CMYK\n- [ ] 圖片解析度足夠\n- [ ] 小字與細線使用 K100\n\n## 檔案\n- [ ] 文字已建立外框\n- [ ] 連結圖檔已嵌入或封裝\n- [ ] 刪除多餘物件與隱藏圖層\n\n## 內容\n- [ ] 價格、日期、檔期已核對\n- [ ] 品牌 Logo 與標準色正確\n- [ ] 錯字已校對"},
 {id:"quote-115",categoryId:"quote",pinned:true,title:"115年度輸出報價單",tags:["報價","115年","輸出"],updatedAt:T0,files:[],links:[],

/* ---------- 狀態與工具 ---------- */
const $ = s => document.querySelector(s);
const state = { mode:"demo", fb:null, user:null, site:SEED_SITE, articles:[], cat:"all", q:"", open:new Set(), loaded:false };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = t => { if(!t) return ""; const d=new Date(t); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); };
const extOf = n => { const m=String(n||"").split(/[?#]/)[0].match(/\.([a-z0-9]{2,5})$/i); return m?m[1].toLowerCase():""; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isEditor = () => state.mode==="live" && !!state.user;
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2800); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function extClass(e){ if(e==="pdf") return "pdf"; if(["png","jpg","jpeg","gif","webp","svg"].includes(e)) return "img"; if(["csv","txt","md","json","xlsx","xls","docx"].includes(e)) return "data"; return ""; }
function hostOf(u){ try{ return new URL(u, location.href).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function safeUrl(u){ u=String(u||"").trim(); if(/^(javascript|data|vbscript):/i.test(u)) return ""; return u; }

/* 「名稱 | 說明 | 網址」拆解 */
function parseRows(text, requireHttp){
  return String(text||"").split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{
    const p=s.split("|").map(x=>x.trim()); const url=safeUrl(p.pop());
    if(p.length>=2) return {label:p[0], note:p.slice(1).join(" | "), url};
    if(p.length===1) return {label:p[0], note:"", url};
    return {label:"", note:"", url};
  }).filter(r=>r.url && (!requireHttp || /^https?:\/\//i.test(r.url)));
}
const rowsToText = rows => (rows||[]).map(r=>(r.label?r.label+" | ":"")+(r.note?r.note+" | ":"")+r.url).join("\n");

/* ---------- 內容排版 ---------- */
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>"); }
const RX_CHECK = /^- \[( |x)\] /i;
function render(body, artId){
  const lines = String(body||"").replace(/\r/g,"").split("\n");
  let html="", i=0, k=0;
  const saved = lsGet("chk:"+artId) || {};
  while(i<lines.length){
    const L = lines[i];
    if(/^\s*$/.test(L)){ i++; continue; }
    if(L.startsWith("### ")){ html+="<h4>"+inline(L.slice(4))+"</h4>"; i++; continue; }
    if(L.startsWith("## ")){ html+="<h3>"+inline(L.slice(3))+"</h3>"; i++; continue; }
    if(L.startsWith("> ")){ const b=[]; while(i<lines.length && lines[i].startsWith("> ")){ b.push(inline(lines[i].slice(2))); i++; } html+="<blockquote>"+b.join("<br>")+"</blockquote>"; continue; }
    if(RX_CHECK.test(L)){
      html+='<ul class="checks">';
      while(i<lines.length && RX_CHECK.test(lines[i])){
        const n=k++; const on = saved[n]!==undefined ? saved[n] : /^- \[x\]/i.test(lines[i]);
        html+='<li><label><input type="checkbox" data-art="'+esc(artId)+'" data-k="'+n+'"'+(on?" checked":"")+'><span>'+inline(lines[i].slice(6))+'</span></label></li>'; i++;
      }
      html+="</ul>"; continue;
    }
    if(L.startsWith("- ")){ html+="<ul>"; while(i<lines.length && lines[i].startsWith("- ") && !RX_CHECK.test(lines[i])){ html+="<li>"+inline(lines[i].slice(2))+"</li>"; i++; } html+="</ul>"; continue; }
    if(L.trim().startsWith("|")){
      const rows=[]; while(i<lines.length && lines[i].trim().startsWith("|")){ rows.push(lines[i].trim()); i++; }
      const clean=rows.filter(r=>!/^[\s|:-]+$/.test(r)); if(!clean.length) continue;
      const cells=r=>r.replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      html+='<div class="tablewrap"><table><thead><tr>'+cells(clean[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
      clean.slice(1).forEach(r=>{ html+="<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; });
      html+="</tbody></table></div>"; continue;
    }
    const b=[]; while(i<lines.length && lines[i].trim() && !/^(## |### |> |- |\s*\|)/.test(lines[i])){ b.push(inline(lines[i])); i++; }
    html+="<p>"+b.join("<br>")+"</p>";
  }
  return html;
}

/* ---------- 畫面 ---------- */
function catName(id){ const c=(state.site.categories||[]).find(c=>c.id===id); return c?c.name:"未分類"; }
function visible(){
  const q=state.q.trim().toLowerCase();
  return state.articles.slice()
    .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || (b.updatedAt||0)-(a.updatedAt||0))
    .filter(a=>{
      if(state.cat!=="all" && a.categoryId!==state.cat) return false;
      if(!q) return true;
      const hay=[a.title,a.body,(a.tags||[]).join(" "),catName(a.categoryId),
        (a.files||[]).map(f=>f.label+" "+f.note).join(" "),(a.links||[]).map(l=>l.label+" "+l.note).join(" ")].join(" ").toLowerCase();
      return q.split(/\s+/).every(w=>hay.includes(w));
    });
}
function renderCats(){
  const count=id=>id==="all"?state.articles.length:state.articles.filter(a=>a.categoryId===id).length;
  const items=[{id:"all",name:"全部"}].concat(state.site.categories||[]);
  $("#cats").innerHTML = items.map(c=>'<button type="button" data-cat="'+esc(c.id)+'" aria-current="'+(state.cat===c.id)+'"><span>'+esc(c.name)+'</span><span class="n">'+count(c.id)+'</span></button>').join("")
    + (isEditor()?'<div class="admin-tools"><button class="btn small" type="button" id="btnCats">管理分類與站名</button>'
      +(state.articles.length===0?'<button class="btn small" type="button" id="btnSeed">匯入範例內容</button>':'')+'</div>':"");
  const b=$("#btnCats"); if(b) b.onclick=openCats;
  const s=$("#btnSeed"); if(s) s.onclick=importSeed;
}
function rowHtml(r, kind){
  const url=r.url, host=hostOf(url);
  if(kind==="file"){
    const e=extOf(url)||extOf(r.label);
    return '<div class="file"><span class="ext '+extClass(e)+'">'+esc(e?e.toUpperCase():"檔案")+'</span><span class="fn"><span class="ln">'+esc(r.label||url)+'</span>'+(r.note?'<span class="lnote">'+esc(r.note)+'</span>':'')+'</span>'
      +'<a class="btn small" href="'+esc(url)+'" target="_blank" rel="noopener" download>下載</a></div>';
  }
  return '<div class="file"><span class="ext link">連結</span><span class="fn"><span class="ln">'+esc(r.label||host||url)+'</span>'+(r.note?'<span class="lnote">'+esc(r.note)+'</span>':'')+'<span class="lhost">'+esc(host)+'</span></span>'
    +'<button class="btn small" type="button" data-copy="'+esc(url)+'">複製網址</button><a class="btn small" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">開啟</a></div>';
}
function renderList(){
  $("#siteTitle").textContent=state.site.title||"美工資料站";
  $("#siteSub").textContent=state.site.subtitle||"";
  document.title=state.site.title||"美工資料站";
  $("#viewTitle").textContent=state.cat==="all"?"全部":catName(state.cat);
  const arr=visible();
  $("#viewCount").textContent=state.loaded?"　共 "+arr.length+" 則":"";
  const list=$("#list");
  if(!state.loaded){ list.innerHTML='<div class="empty">載入中…</div>'; return; }
  if(!arr.length){
    list.innerHTML='<div class="empty">'+(state.q?"找不到符合「"+esc(state.q)+"」的內容，換個關鍵字試試。":(isEditor()?"這個分類還沒有內容，按「新增條目」開始建立。":"這個分類還沒有內容。"))+'</div>'; return;
  }
  list.innerHTML=arr.map(a=>{
    const open=state.open.has(a.id); const files=a.files||[], links=a.links||[];
    return '<article class="item'+(open?" open":"")+'">'
      +'<button type="button" class="item-head" data-toggle="'+esc(a.id)+'" aria-expanded="'+open+'">'
        +'<span><span class="t">'+(a.pinned?'<span class="pin" title="置頂"></span>':"")+esc(a.title)+'</span>'
        +((a.tags&&a.tags.length)?'<span class="tags">'+a.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</span>':"")+'</span>'
        +'<span class="meta">'+esc(catName(a.categoryId))+'　'+fmtDate(a.updatedAt)+(files.length?'　附件 '+files.length:"")+'</span>'
      +'</button>'
      +'<div class="item-body">'
        +'<div class="prose">'+(open?render(a.body,a.id):"")+'</div>'
        +((files.length||links.length)?'<div class="files">'+files.map(f=>rowHtml(f,"file")).join("")+links.map(l=>rowHtml(l,"link")).join("")+'</div>':"")
        +(isEditor()?'<div class="item-admin"><button class="btn small" type="button" data-edit="'+esc(a.id)+'">編輯</button><button class="btn small danger" type="button" data-del="'+esc(a.id)+'">刪除</button></div>':"")
      +'</div></article>';
  }).join("");
}
function renderStatus(msg){
  if(msg!==undefined){ $("#status").innerHTML=msg; return; }
  $("#status").innerHTML = state.mode==="demo"
    ? '<div class="notice warn">示範模式：尚未連接 Firebase，目前顯示的是範例內容，無法編輯。</div>' : "";
}
function renderAll(){
  renderCats(); renderList();
  $("#adminBar").hidden=!isEditor();
  $("#btnLogin").textContent = state.user ? "登出" : "管理登入";
  $("#btnLogin").hidden = state.mode!=="live";
  $("#whoami").textContent = state.user ? "已登入："+(state.user.email||"") : "";
}

/* ---------- 事件 ---------- */
$("#cats").addEventListener("click",e=>{ const b=e.target.closest("[data-cat]"); if(!b) return; state.cat=b.dataset.cat; renderAll(); });
let qTimer; $("#q").addEventListener("input",e=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ state.q=e.target.value; renderList(); },150); });
$("#list").addEventListener("click",e=>{
  const t=e.target.closest("[data-toggle]"); if(t){ const id=t.dataset.toggle; state.open.has(id)?state.open.delete(id):state.open.add(id); renderList(); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ copyText(cp.dataset.copy); return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ openEdit(ed.dataset.edit); return; }
  const del=e.target.closest("[data-del]"); if(del){ removeArticle(del.dataset.del); return; }
});
$("#list").addEventListener("change",e=>{
  const c=e.target.closest("input[data-art]"); if(!c) return;
  const key="chk:"+c.dataset.art; const s=lsGet(key)||{}; s[c.dataset.k]=c.checked; lsSet(key,s);
});
async function copyText(t){
  const full = new URL(t, location.href).href;
  try{ await navigator.clipboard.writeText(full); toast("已複製網址"); return; }catch(e){}
  prompt("請手動複製網址：", full);
}

/* ---------- 登入 ---------- */
$("#btnLogin").onclick=async()=>{
  if(state.user){ await state.fb.signOut(state.fb.auth); toast("已登出"); return; }
  $("#lPass").value=""; $("#dlgLogin").showModal(); $("#lEmail").focus();
};
$("#btnLoginCancel").onclick=()=>$("#dlgLogin").close();
async function doLogin(){
  const btn=$("#btnLoginGo"); btn.disabled=true;
  try{ await state.fb.signInWithEmailAndPassword(state.fb.auth,$("#lEmail").value.trim(),$("#lPass").value); $("#dlgLogin").close(); toast("已登入"); }
  catch(e){ toast("登入失敗：請確認 Email 與密碼"); }
  finally{ btn.disabled=false; }
}
$("#btnLoginGo").onclick=doLogin;
$("#lPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });

/* ---------- 寫入（Firebase） ---------- */
function writeErr(e){ return (e&&e.code==="permission-denied") ? "沒有編輯權限，請確認 Firestore 規則裡的 UID" : "儲存失敗，請再試一次"; }
async function putArticle(id,data){ const f=state.fb; await f.setDoc(f.doc(f.db,COL_ARTICLES,id),data); }
async function putSite(data){ const f=state.fb; await f.setDoc(f.doc(f.db,DOC_SITE[0],DOC_SITE[1]),data); }

async function importSeed(){
  if(!confirm("匯入範例內容（分類與 9 篇文章）？")) return;
  const f=state.fb;
  try{
    const b=f.writeBatch(f.db);
    b.set(f.doc(f.db,DOC_SITE[0],DOC_SITE[1]),SEED_SITE);
    SEED_ARTICLES.forEach(a=>{ const {id,...rest}=a; b.set(f.doc(f.db,COL_ARTICLES,id),{...rest,updatedAt:Date.now()}); });
    await b.commit(); toast("已匯入範例內容");
  }catch(e){ toast(writeErr(e)); }
}

/* ---------- 編輯條目 ---------- */
let editingId=null;
function openEdit(id){
  const cats=state.site.categories||[];
  if(!cats.length){ toast("請先在「管理分類與站名」新增分類"); return; }
  const a=id?state.articles.find(x=>x.id===id):null;
  editingId=a?a.id:uid();
  $("#editHead").textContent=a?"編輯條目":"新增條目";
  $("#fTitle").value=a?a.title:"";
  const cur=a?a.categoryId:(state.cat!=="all"?state.cat:cats[0].id);
  $("#fCat").innerHTML=cats.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===cur?" selected":"")+'>'+esc(c.name)+'</option>').join("");
  $("#fTags").value=a?(a.tags||[]).join(", "):"";
  $("#fBody").value=a?(a.body||""):"";
  $("#fFiles").value=a?rowsToText(a.files):"";
  $("#fLinks").value=a?rowsToText(a.links):"";
  $("#fPin").checked=!!(a&&a.pinned);
  $("#dlgEdit").showModal(); $("#fTitle").focus();
}
$("#btnNew").onclick=()=>openEdit(null);
$("#btnCancel").onclick=()=>$("#dlgEdit").close();
$("#btnSave").onclick=async()=>{
  const title=$("#fTitle").value.trim(); if(!title){ toast("請填寫標題"); $("#fTitle").focus(); return; }
  const btn=$("#btnSave"); btn.disabled=true; btn.textContent="儲存中…";
  const data={
    title, categoryId:$("#fCat").value,
    tags:$("#fTags").value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),
    body:$("#fBody").value,
    files:parseRows($("#fFiles").value,false),
    links:parseRows($("#fLinks").value,true),
    pinned:$("#fPin").checked, updatedAt:Date.now()
  };
  try{ await putArticle(editingId,data); state.open.add(editingId); $("#dlgEdit").close(); toast("已儲存"); }
  catch(e){ toast(writeErr(e)); }
  finally{ btn.disabled=false; btn.textContent="儲存"; }
};
async function removeArticle(id){
  const a=state.articles.find(x=>x.id===id); if(!a) return;
  if(!confirm("確定刪除「"+a.title+"」？刪除後無法復原。")) return;
  try{ const f=state.fb; await f.deleteDoc(f.doc(f.db,COL_ARTICLES,id)); toast("已刪除"); }
  catch(e){ toast(writeErr(e)); }
}

/* ---------- 分類管理 ---------- */
let catDraft=[];
function renderCatEdit(){
  $("#catEdit").innerHTML=catDraft.map((c,i)=>{
    const used=state.articles.some(a=>a.categoryId===c.id);
    return '<div class="catrow"><input type="text" data-ci="'+i+'" value="'+esc(c.name)+'" aria-label="分類名稱">'
      +'<button type="button" class="btn small" data-up="'+i+'" aria-label="上移"'+(i===0?" disabled":"")+'>↑</button>'
      +'<button type="button" class="btn small" data-down="'+i+'" aria-label="下移"'+(i===catDraft.length-1?" disabled":"")+'>↓</button>'
      +'<button type="button" class="btn small danger" data-rmc="'+i+'"'+(used?' disabled title="此分類還有條目"':"")+'>刪除</button></div>';
  }).join("");
}
function openCats(){
  catDraft=(state.site.categories||[]).map(c=>({...c}));
  $("#sTitle").value=state.site.title||""; $("#sSub").value=state.site.subtitle||"";
  renderCatEdit(); $("#dlgCats").showModal();
}
$("#catEdit").addEventListener("input",e=>{ const i=e.target.dataset.ci; if(i!==undefined) catDraft[+i].name=e.target.value; });
$("#catEdit").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;

  else if(b.dataset.rmc){ catDraft.splice(+b.dataset.rmc,1); }

$("#btnAddCat").onclick=()=>{ catDraft.push({id:"c"+uid(),name:"新分類"}); renderCatEdit(); const ins=$("#catEdit").querySelectorAll("input"); ins[ins.length-1].select(); };
$("#btnCatsCancel").onclick=()=>$("#dlgCats").close();
$("#btnCatsSave").onclick=async()=>{

    categories:catDraft.map(c=>({id:c.id,name:c.name.trim()})).filter(c=>c.name)};
  try{ await putSite(site); $("#dlgCats").close(); toast("已儲存"); }
  catch(e){ toast(writeErr(e)); }
};

/* ---------- 啟動 ---------- */
async function start(){
  if(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){
    state.mode="demo"; state.site=SEED_SITE; state.articles=SEED_ARTICLES.slice(); state.loaded=true;
    renderStatus(); renderAll(); return;
  }
  state.mode="live"; state.site={title:"美工資料站",subtitle:"",categories:[]};
  renderStatus(); renderAll();
  try{
    const base="https://www.gstatic.com/firebasejs/"+FB_VER+"/";
    const [appM, fsM, auM] = await Promise.all([
      import(base+"firebase-app.js"), import(base+"firebase-firestore.js"), import(base+"firebase-auth.js")
    ]);
    const app=appM.initializeApp(FIREBASE_CONFIG);
    const db=fsM.getFirestore(app); const auth=auM.getAuth(app);
    state.fb={db,auth,doc:fsM.doc,setDoc:fsM.setDoc,deleteDoc:fsM.deleteDoc,writeBatch:fsM.writeBatch,
      signInWithEmailAndPassword:auM.signInWithEmailAndPassword,signOut:auM.signOut};
    const fail=()=>renderStatus('<div class="notice warn">資料讀取失敗：請確認 Firestore 規則允許讀取，或重新整理頁面。</div>');
    fsM.onSnapshot(fsM.doc(db,DOC_SITE[0],DOC_SITE[1]),s=>{
      if(s.exists()){ const d=s.data(); state.site={title:d.title||"",subtitle:d.subtitle||"",categories:Array.isArray(d.categories)?d.categories:[]}; }
      renderAll();
    },fail);
    fsM.onSnapshot(fsM.collection(db,COL_ARTICLES),s=>{
      state.articles=s.docs.map(d=>({id:d.id,...d.data()})); state.loaded=true; renderStatus(); renderAll();
    },fail);
    auM.onAuthStateChanged(auth,u=>{ state.user=u; renderAll(); });
  }catch(e){
    renderStatus('<div class="notice warn">無法連接 Firebase，請檢查網路或 FIREBASE_CONFIG 設定。</div>');
  }
}
start();
</script>
</body>
</html>
